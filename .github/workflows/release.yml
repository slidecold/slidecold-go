name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Ask proxy.golang.org to fetch the tag (pkg.go.dev picks it up from there)
        # The proxy can cache "unknown revision" for a just-pushed tag, so retry instead of failing the release
        run: |
          for i in $(seq 10); do
            curl -fsS "https://proxy.golang.org/github.com/slidecold/slidecold-go/@v/${GITHUB_REF_NAME}.info" && exit 0
            sleep 60
          done
          echo "::warning::proxy.golang.org has not picked up ${GITHUB_REF_NAME} yet; it will on first go get"
