version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*text/tabwriter.Writer).Flush
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ClientSession).Close
