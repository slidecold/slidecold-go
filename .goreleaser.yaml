# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: slidecold

builds:
  - id: slidecold
    main: ./cmd/slidecold
    binary: slidecold
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{ .Version }}']
  - id: slidecold-mcp
    # Nested module (go-sdk needs Go >= 1.25); go.work makes it build against this checkout.
    dir: cmd/slidecold-mcp
    main: .
    binary: slidecold-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{ .Version }}']

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
